name: Build tmnt3mn.exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-exes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build 64-bit Windows exe
        run: |
          x86_64-w64-mingw32-gcc -O2 tmnt3mn.c -o tmnt3mn-win64.exe

      - name: Build 32-bit Windows exe
        run: |
          i686-w64-mingw32-gcc -O2 tmnt3mn.c -o tmnt3mn-win32.exe || echo "32-bit build failed (toolchain may be missing)"

      - name: Show outputs
        run: ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tmnt3mn-windows-exes
          path: |
            tmnt3mn-win64.exe
            tmnt3mn-win32.exe
