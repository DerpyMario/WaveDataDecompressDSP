name: Build Windows EXE

on:
  push:
    paths:
      - 'kss_dsp_extract.c'
      - 'pactool.c'
      - '.github/workflows/build-windows-exe.yml'

jobs:
  build:
    name: Build kss_dsp_extract.exe & RockmanFilePack.exe (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Compile kss_dsp_extract.exe (x86_64-w64-mingw32)
        run: |
          x86_64-w64-mingw32-gcc -O2 -static -o kss_dsp_extract.exe kss_dsp_extract.c

      - name: Compile pactool.c to RockmanFilePack.exe (x86_64-w64-mingw32)
        run: |
          x86_64-w64-mingw32-gcc -std=c11 -O2 -static -o RockmanFilePack.exe pactool.c

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE-x86_64
          path: |
            kss_dsp_extract.exe
            RockmanFilePack.exe
