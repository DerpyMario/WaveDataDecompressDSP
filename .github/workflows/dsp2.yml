name: Build Windows EXE

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-exe:
    name: Build kss_dsp_extract.exe (cross-compile on Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mingw-w64 (cross-compiler)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Compile kss_dsp_extract.c -> kss_dsp_extract.exe
        run: |
          x86_64-w64-mingw32-gcc -O2 -o kss_dsp_extract.exe kss_dsp_extract.c

      - name: Show artifact info
        run: |
          echo "Built files:"
          ls -lh kss_dsp_extract.exe || true

      - name: Upload built EXE
        uses: actions/upload-artifact@v4
        with:
          name: kss_dsp_extract-exe
          path: kss_dsp_extract.exe
