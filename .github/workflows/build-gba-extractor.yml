name: Build GBA Extractors

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'gba_sample_extract_v1.cpp'
      - 'gba_sappy_to_midi.cpp'
      - '.github/workflows/build-gba-extractor.yml'

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up build tools (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y build-essential g++

    - name: Set executable names
      id: names
      shell: bash
      run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          echo "exe_ext=.exe" >> $GITHUB_OUTPUT
        else
          echo "exe_ext=" >> $GITHUB_OUTPUT
        fi

    - name: Build GBA Sample Extractor
      run: g++ -O2 -std=c++17 -o "GBA Sample Extractor${{ steps.names.outputs.exe_ext }}" gba_sample_extract_v1.cpp

    - name: Build GBA Sappy to MIDI
      run: g++ -O2 -std=c++17 -o "GBA Sappy to MIDI${{ steps.names.outputs.exe_ext }}" gba_sappy_to_midi.cpp

    - name: Verify executables (Unix)
      if: runner.os != 'Windows'
      run: |
        ls -lh "GBA Sample Extractor" "GBA Sappy to MIDI"
        ./"GBA Sample Extractor" --help
        ./"GBA Sappy to MIDI" --help 2>&1 || true

    - name: Verify executables (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        ls "GBA Sample Extractor.exe" | Format-List Length, Name
        ls "GBA Sappy to MIDI.exe" | Format-List Length, Name
        & ".\GBA Sample Extractor.exe" --help | head -5
        & ".\GBA Sappy to MIDI.exe" --help 2>&1 | head -5 || $true

    - name: Bundle Windows DLLs
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Find MinGW DLLs from the default GCC installation
        $mingwPath = "C:\Program Files\mingw64\bin"
        if (Test-Path "$mingwPath\libstdc++-6.dll") {
          Copy-Item "$mingwPath\libstdc++-6.dll" .
          Copy-Item "$mingwPath\libgcc_s_seh-1.dll" .
          Copy-Item "$mingwPath\libwinpthread-1.dll" .
          Write-Output "Copied DLLs from $mingwPath"
        } else {
          # Fallback: use gcc to find the DLL path
          $gcc = Get-Command gcc.exe -ErrorAction SilentlyContinue
          if ($gcc) {
            $gccDir = Split-Path $gcc.Source
            if (Test-Path "$gccDir\libstdc++-6.dll") {
              Copy-Item "$gccDir\libstdc++-6.dll" .
              Copy-Item "$gccDir\libgcc_s_seh-1.dll" .
              Copy-Item "$gccDir\libwinpthread-1.dll" .
              Write-Output "Copied DLLs from $gccDir"
            }
          }
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GBA-Extractors-${{ runner.os }}
        path: |
          GBA Sample Extractor*
          GBA Sappy to MIDI*
          libstdc++-6.dll
          libgcc_s_seh-1.dll
          libwinpthread-1.dll
        retention-days: 30
