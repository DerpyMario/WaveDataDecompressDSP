name: Build GBA Sample Extractor

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'gba_sample_extract_v1.cpp'
      - 'gba_sappy_to_midi.cpp'
      - '.github/workflows/build-gba-extractor.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'gba_sample_extract_v1.cpp'
      - 'gba_sappy_to_midi.cpp'
      - '.github/workflows/build-gba-extractor.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential g++

    - name: Build GBA Sample Extractor
      run: g++ -O2 -std=c++17 -o "GBA Sample Extractor" gba_sample_extract_v1.cpp

    - name: Build GBA Sappy to MIDI
      run: g++ -O2 -std=c++17 -o "GBA Sappy to MIDI" gba_sappy_to_midi.cpp

    - name: Verify executables
      run: |
        ls -lh "GBA Sample Extractor" "GBA Sappy to MIDI"
        ./"GBA Sample Extractor" --help
        ./"GBA Sappy to MIDI" --help 2>&1 || true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GBA-Extractors-Linux
        path: |
          GBA Sample Extractor
          GBA Sappy to MIDI
        retention-days: 50
